name: CI/CD Deploy to STB

# Memicu pipeline setiap kali ada git push ke branch 'main'
on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # 1. TAHAP CI (Continuous Integration)
  # A. Uji Coba Cepat: Pengecekan Sintaks
  # ==========================================
  syntax-check:
    name: Validasi Sintaks Kode (CI)
    runs-on: self-hosted
    steps:
      - name: Ambil Kode Terbaru
        uses: actions/checkout@v4

      - name: Uji Sintaks Python
        run: |
          echo "🔍 Memeriksa sintaks kode Python..."
          python3 -m py_compile app/bot.py app/database.py
          echo "✅ Semua berkas Python valid dan bebas error sintaks!"

  # ==========================================
  # 1. TAHAP CI: Pre-Deployment QA Testing
  # B. Uji Logika Bisnis & Fitur (Pytest)
  # ==========================================
  qa-automated-tests:
    name: QA Automated Testing (Pytest)
    needs: syntax-check
    runs-on: self-hosted
    steps:
      - name: Ambil Kode Terbaru
        uses: actions/checkout@v4

      - name: Siapkan Dependensi Pengujian
        run: |
          python3 -m pip install pytest || pip3 install pytest

      - name: Jalankan Suite Pengujian QA (Pre-Deploy)
        run: |
          echo "🧪 Menjalankan pengujian otomatis QA (Pre-Deploy)..."
          python3 -m pytest -v tests/
          echo "🎉 Semua skenario uji QA berhasil lolos!"

  # ==========================================
  # 2. TAHAP CD (Continuous Deployment)
  # Hanya jalan jika SEMUA uji coba QA lolos!
  # ==========================================
  deploy:
    name: Deploy ke Kontainer Docker (CD)
    needs: qa-automated-tests
    runs-on: self-hosted
    steps:
      - name: Eksekusi Update di STB
        run: |
          echo "🚀 Memulai proses deployment di STB..."
          cd ~/motor-tracker-bot
          git pull origin main
          docker compose up -d --build
          echo "🎉 Deployment selesai! Kontainer bot telah diperbarui dan aktif."
